services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: cf-notify-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cloudflare_notify}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cloudflare_notify}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # NestJS Backend Service (Automatically runs Prisma migrations on startup)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cf-notify-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "15433:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cloudflare_notify}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-min-32-chars-long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PORT: 4000
    networks:
      - app-network

  # Next.js Frontend Service
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:15433}
    container_name: cf-notify-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "15434:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:15433}
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
