services:
  # 1. NestJS Backend Service (Connected to Coolify network for direct internal PostgreSQL access)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cf-notify-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-15433}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      TELEGRAM_PROXY_WORKER_URL: ${TELEGRAM_PROXY_WORKER_URL:-}
      TELEGRAM_PROXY_SECRET: ${TELEGRAM_PROXY_SECRET:-}
      TELEGRAM_SYSTEM_BOT_TOKEN: ${TELEGRAM_SYSTEM_BOT_TOKEN:-}
      TELEGRAM_SYSTEM_BOT_USERNAME: ${TELEGRAM_SYSTEM_BOT_USERNAME:-}
      TELEGRAM_ENABLE_POLLING: ${TELEGRAM_ENABLE_POLLING:-false}
    networks:
      - app-network
      - coolify

  # 2. Next.js Frontend Dashboard Service (Proxies /api directly to internal NestJS backend)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cf-notify-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-15434}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_BACKEND_URL: http://backend:4000
    networks:
      - app-network
      - coolify

networks:
  app-network:
    driver: bridge
  coolify:
    name: coolify
    external: true
